name: CI

# A plataforma tem CI próprio (plataforma-ci.yml). Os contratos entram aqui porque o app os importa.
on:
  pull_request:
    paths: ['**', '!plataforma/**', 'plataforma/contratos/**']
  push:
    branches: [main]
    paths: ['**', '!plataforma/**', 'plataforma/contratos/**']

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install chromium
      - run: npm test
