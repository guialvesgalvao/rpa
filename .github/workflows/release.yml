# Publica o instalador nos GitHub Releases ao receber uma tag vX.Y.Z (criada por `npm version`).
# Os apps instalados leem o latest.yml desse Release e se atualizam.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Tag confere com a versão do package.json
        shell: bash
        run: |
          versao="v$(node -p "require('./package.json').version")"
          if [ "$versao" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME diferente da versão do package.json ($versao)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install chromium
      - run: npm test
      # URL pública da API da plataforma (Railway), embutida no app pelo scripts/build-app.mjs.
      - run: npm run app:build
        env:
          RPA_API_URL: https://rpa-production-f552.up.railway.app
      - run: npx electron-builder --win --publish never
      # Um único passo cria o Release com os 3 arquivos; o upload paralelo do electron-builder
      # chegou a criar dois Releases para a mesma tag.
      - name: Publica o Release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes             release/RPA-Bling-Setup-*.exe release/RPA-Bling-Setup-*.exe.blockmap release/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
