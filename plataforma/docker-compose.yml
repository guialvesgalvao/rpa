# Postgres e S3 locais, só para desenvolvimento e testes. Produção fica no Railway.
name: rpa-plataforma

services:
  postgres:
    image: postgres:18
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: rpa
      POSTGRES_PASSWORD: rpa
      POSTGRES_DB: rpa
    volumes:
      - dados:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Via TCP: durante o init o Postgres só escuta no socket, então só fica saudável depois dele.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'rpa', '-d', 'rpa']
      interval: 2s
      timeout: 5s
      retries: 30

  # S3 local (S3Mock), só para desenvolvimento e testes: aceita qualquer credencial e guarda em memória.
  # Produção usa o Storage Bucket do Railway (variáveis ARQUIVOS_S3_*).
  s3:
    image: adobe/s3mock:4.7.0
    ports:
      - '127.0.0.1:9090:9090'
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: rpa-arquivos,rpa-arquivos-teste

volumes:
  dados:
